<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src * blob: data:; img-src * data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>TV AirPlay Cast</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; font: 16px system-ui, sans-serif; }
    #status { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 48px; gap: 6px; }
    #status h1 { margin: 0 0 12px; font-size: 32px; font-weight: 600; }
    #status .row { font-size: 18px; color: #b8b8b8; }
    #status .row b { color: #fff; font-weight: 500; }
    #status .hint { margin-top: 24px; font-size: 14px; color: #888; max-width: 560px; line-height: 1.5; }
    #player { display: none; position: fixed; inset: 0; background: #000; }
    #player video, #player canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    body.playing #status { display: none; }
    body.playing #player { display: block; }
    body.mirror video { display: none; }
    body:not(.mirror) canvas { display: none; }
  </style>
</head>
<body>
  <div id="status">
    <h1 id="title">TV AirPlay Cast</h1>
    <div class="row">AirPlay: <b id="s-airplay">starting</b></div>
    <div class="row">DLNA / UPnP: <b id="s-dlna">starting</b></div>
    <div class="hint">
      On your iPhone open Control Center &rarr; Screen Mirroring and pick this computer.
      DLNA apps (BubbleUPnP, VLC, Windows "Cast to device") see it as a media renderer.
      Press Esc while casting to disconnect.
    </div>
  </div>
  <div id="player">
    <video id="video"></video>
    <canvas id="canvas"></canvas>
  </div>
  <script src="app.js"></script>
</body>
</html>
