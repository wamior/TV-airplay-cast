name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-airplay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-airplay
          path: tv-airplay.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" tv-airplay.apk \
            --title "TV AirPlay Cast build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}" --latest
